# yaml-language-server: $schema=https://schema.buildwithfern.dev/docs-yml.json

instances:
  # Fern requires the same /isaac-os base path on its URL and docs.nvidia.com custom domain.
  # https://buildwithfern.com/learn/dashboard/configuration/custom-domains
  - url: isaac-os.docs.buildwithfern.com/isaac-os

metadata:
  canonical-host: "docs.nvidia.com/isaac-os"

global-theme: nvidia

ai-search:
  location:
    - docs

title: Isaac OS Documentation

versions:
  - display-name: Latest
    path: ./index.yml

layout:
  searchbar-placement: header
  page-width: 1376px
  sidebar-width: 248px
  content-width: 812px
  tabs-placement: header
  hide-feedback: true

colors:
  accentPrimary:
    dark: '#76B900'
    light: '#76B900'
  background:
    light: '#FFFFFF'
    dark: '#000000'

page-actions:
  options:
    chatgpt: false
    claude: false

theme:
  page-actions: toolbar
  footer-nav: minimal

logo:
  dark: assets/NVIDIA_dark.svg
  light: assets/NVIDIA_light.svg
  height: 20
  href: /isaac-os
  right-text: Isaac OS Documentation

favicon: assets/NVIDIA_symbol.svg

settings:
  hide-404-page: true
  substitute-env-vars: false

js:
  - path: dist/output.js
    strategy: afterInteractive
css:
  - assets/theme.css
  - dist/output.css
