      dim: 14

# WBC controls the legs and waist; N1.7 controls the arms and hands.
wbc_gr00t_joint_command_combiner:
  sdk_joint_order: *g1_sdk_43
  joint_names_from_wbc: *hybrid_lower_body_15
  joint_names_from_gr00t: *hybrid_gr00t_upper_28
  gpu_output: false
  # Real-app handoff delay.
  gr00t_startup_delay_s: 1.0

# Simulator hybrid command partition.
sim_wbc_gr00t_joint_command_combiner:
  sdk_joint_order: *g1_sdk_43
  joint_names_from_wbc: *hybrid_lower_body_15
  joint_names_from_gr00t: *hybrid_gr00t_upper_28
  gpu_output: false
  gr00t_startup_delay_s: 0.0

# --- Stable start-up controller ---
# Moves the G1 into a kinematically stable standing pose on startup, through a series of waypoints
# then releases control to the WBC/GR00T controller. The setup routine lives in the linked config_file.
start_up:
  sdk_joint_order: *g1_sdk_43 # 43-joint publisher command order
  config_file: operators/start_up/config/g1_start_up.yaml
  auto_enable_delay: 60.0 # s holding the final pose before automatic enable (0 = immediate)
  upper_body_joints: *g1_gr00t_upper_31 # held at the startup pose until the upper enable (in_enable_upper)

# Simulation start-up: the robot spawns standing, so a short routine reaches the WBC-ready pose in
# ~30 ticks instead of ~350, and the hold is released immediately rather than after a 60 s wait
# measured in simulated time. The upper body still waits for the upper enable, so O toggles GR00T.
sim_start_up:
  sdk_joint_order: *g1_sdk_43 # 43-joint publisher command order
  config_file: operators/start_up/config/g1_start_up_sim.yaml
  auto_enable_delay: 0.0 # s holding the final pose before automatic enable (0 = immediate)
  upper_body_joints: *g1_gr00t_upper_31 # held at the startup pose until the upper enable (in_enable_upper)
