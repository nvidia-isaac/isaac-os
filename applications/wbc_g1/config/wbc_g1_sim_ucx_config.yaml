# ── N1.7 joint groups ─────────────────────────────────────────────────────────
# Intra-group order is assumed to equal SDK order (g1_sdk_43); must match the checkpoint's
# training order — CONFIRM with Billy Okal before trusting motion.
#
# Hand groups are split into separate state-input and action-output orders because the
# checkpoint uses DIFFERENT intra-group orders for each (confirmed against
# data/n17/g1-apple-to-plate/exported_leapp.yaml `element_names`, the ground truth for each
# ONNX model's column order):
#   preprocess_state input  left_hand:  thumb0,1,2, middle0,1, index0,1
#   preprocess_state input  right_hand: thumb0,1,2, index0, middle0, index1, middle1
#   decode_action output    {left,right}_hand: index0,1, middle0,1, thumb0,1,2
joint_groups_n17:
  left_leg: &g1_left_leg_6
    - left_hip_pitch_joint
    - left_hip_roll_joint
    - left_hip_yaw_joint
    - left_knee_joint
    - left_ankle_pitch_joint
    - left_ankle_roll_joint
  right_leg: &g1_right_leg_6
    - right_hip_pitch_joint
    - right_hip_roll_joint
    - right_hip_yaw_joint
    - right_knee_joint
    - right_ankle_pitch_joint
    - right_ankle_roll_joint
  waist: &g1_waist_3
    - waist_yaw_joint
    - waist_roll_joint
    - waist_pitch_joint
  left_arm: &g1_left_arm_7
    - left_shoulder_pitch_joint
    - left_shoulder_roll_joint
    - left_shoulder_yaw_joint
    - left_elbow_joint
    - left_wrist_roll_joint
    - left_wrist_pitch_joint
    - left_wrist_yaw_joint
  right_arm: &g1_right_arm_7
    - right_shoulder_pitch_joint
    - right_shoulder_roll_joint
    - right_shoulder_yaw_joint
    - right_elbow_joint
    - right_wrist_roll_joint
    - right_wrist_pitch_joint
    - right_wrist_yaw_joint
  # State-input order (preprocess_state.onnx), from exported_leapp.yaml element_names.
  left_hand_state: &g1_left_hand_state_7
    - left_hand_thumb_0_joint
    - left_hand_thumb_1_joint
    - left_hand_thumb_2_joint
    - left_hand_middle_0_joint
    - left_hand_middle_1_joint
    - left_hand_index_0_joint
    - left_hand_index_1_joint
  right_hand_state: &g1_right_hand_state_7
    - right_hand_thumb_0_joint
    - right_hand_thumb_1_joint
    - right_hand_thumb_2_joint
    - right_hand_index_0_joint
    - right_hand_index_1_joint
    - right_hand_middle_0_joint
    - right_hand_middle_1_joint
  # Action-output order (decode_action.onnx), from exported_leapp.yaml element_names. Differs
  # from the state-input order above — do not reuse one list for both.
  left_hand_action: &g1_left_hand_action_7
    - left_hand_index_0_joint
    - left_hand_index_1_joint
    - left_hand_middle_0_joint
    - left_hand_middle_1_joint
    - left_hand_thumb_0_joint
    - left_hand_thumb_1_joint
    - left_hand_thumb_2_joint
  right_hand_action: &g1_right_hand_action_7
    - right_hand_index_0_joint
    - right_hand_index_1_joint
    - right_hand_middle_0_joint
    - right_hand_middle_1_joint
    - right_hand_thumb_0_joint
    - right_hand_thumb_1_joint
    - right_hand_thumb_2_joint
  # Combiner split: legs (12) from WBC; arms+hands+waist (31) from GR00T N1.7.
  legs_12: &g1_legs_12
    - left_hip_pitch_joint
    - left_hip_roll_joint
    - left_hip_yaw_joint
    - left_knee_joint
    - left_ankle_pitch_joint
    - left_ankle_roll_joint
    - right_hip_pitch_joint
    - right_hip_roll_joint
    - right_hip_yaw_joint
    - right_knee_joint
    - right_ankle_pitch_joint
    - right_ankle_roll_joint
  gr00t_upper_31: &g1_gr00t_upper_31
    - left_shoulder_pitch_joint
    - left_shoulder_roll_joint
    - left_shoulder_yaw_joint
    - left_elbow_joint
    - left_wrist_roll_joint
    - left_wrist_pitch_joint
    - left_wrist_yaw_joint
    - right_shoulder_pitch_joint
    - right_shoulder_roll_joint
    - right_shoulder_yaw_joint
    - right_elbow_joint
    - right_wrist_roll_joint
    - right_wrist_pitch_joint
    - right_wrist_yaw_joint
    - left_hand_thumb_0_joint
    - left_hand_thumb_1_joint
    - left_hand_thumb_2_joint
    - left_hand_middle_0_joint
    - left_hand_middle_1_joint
    - left_hand_index_0_joint
    - left_hand_index_1_joint
    - right_hand_thumb_0_joint
    - right_hand_thumb_1_joint
    - right_hand_thumb_2_joint
    - right_hand_middle_0_joint
    - right_hand_middle_1_joint
    - right_hand_index_0_joint
    - right_hand_index_1_joint
