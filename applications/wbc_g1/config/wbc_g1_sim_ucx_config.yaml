# GR00T configuration profiles. Shared application configuration remains at the root; each GR00T
# control subgraph reads the profile matching its execution environment.
profiles:
  real:
    periodic_conditions:
      inference: 0.2 # 5 Hz
    gr00t_n1_7_inference:
      config_path: operators/gr00t_n1_7/config/n1_7_g1.yaml
    # Seven state groups (positions) + ego_view video (float32 [1,480,640,3]).
    gr00t_n1_7_preprocessor:
      sdk_joint_order: *g1_sdk_43
      state_output_spec:
        left_leg: *g1_left_leg_6
        right_leg: *g1_right_leg_6
        waist: *g1_waist_3
        left_arm: *g1_left_arm_7
        right_arm: *g1_right_arm_7
        left_hand: *g1_left_hand_state_7
        right_hand: *g1_right_hand_state_7
      view_name: ego_view
      crop_height: 480
      crop_width: 640
    gr00t_n1_7_postprocessor:
      num_motors: 43
      prediction_horizon: 16
      joint_order: *g1_sdk_43
      input_spec:
        left_arm: *g1_left_arm_7
        right_arm: *g1_right_arm_7
        left_hand: *g1_left_hand_action_7
        right_hand: *g1_right_hand_action_7
        waist: *g1_waist_3
      kp:
        left_arm: [40.0]
        right_arm: [40.0]
        left_hand: [0.5]
        right_hand: [0.5]
        waist: [100.0]
      kd:
        left_arm: [10.0]
        right_arm: [10.0]
        left_hand: [0.2]
        right_hand: [0.2]
        waist: [10.0]
    action_handler:
      # Seconds per chunk step, at the 30 Hz the checkpoint was trained at. Maps the camera frame's
      # measured age onto a position in the chunk, so it sets playback speed.
      dt: 0.0333333
      # Chunk steps over which the position discontinuity at chunk handover decays to zero;
      # 0 disables. Keep well under the ~6 steps between replans so each handover finishes before
      # the next chunk arrives.
      handover_blend_steps: 3.0
      feedforward_torque: true # set false to output zero effort (e.g. for gravity-comp experiments)
      gpu_output: false # emit CPU tensors for the CPU-side combiner

  sim:
    periodic_conditions:
      # Replan before the last valid action at step 39 (0.78 s) to leave cadence-jitter headroom.
      inference: 0.7
    gr00t_n1_7_inference:
      config_path: operators/gr00t_n1_7/config/n1_7_g1_apple_sim_trt.yaml
    # The simulator policy observes only the five upper-body state groups.
    gr00t_n1_7_preprocessor:
      sdk_joint_order: *g1_sdk_43
      state_output_spec:
        waist: *g1_waist_3
        left_arm: *g1_left_arm_7
        right_arm: *g1_right_arm_7
        left_hand: *g1_left_hand_state_7
        right_hand: *g1_right_hand_state_7
      view_name: ego_view
      crop_height: 480
      crop_width: 640
    gr00t_n1_7_postprocessor:
      num_motors: 43
      prediction_horizon: 40
      joint_order: *g1_sdk_43
      input_spec:
        left_arm: *g1_left_arm_7
        right_arm: *g1_right_arm_7
        left_hand: *g1_left_hand_action_7
        right_hand: *g1_right_hand_action_7
        waist: *g1_waist_3
      kp:
        left_arm: [40.0]
        right_arm: [40.0]
        left_hand: [0.5]
        right_hand: [0.5]
        waist: [100.0]
      kd:
        left_arm: [10.0]
        right_arm: [10.0]
        left_hand: [0.2]
        right_hand: [0.2]
        waist: [10.0]
    action_handler:
      # Replay all 40 steps at the simulator's 50 Hz control rate.
      dt: 0.02
      gpu_output: false
    g1_sim_ucx:
      hostname: "127.0.0.1"
      port: 50008
      defer_connection_until_graph_start: true
      enable_camera: true
      camera_tensor_buffer_size: 1228800

