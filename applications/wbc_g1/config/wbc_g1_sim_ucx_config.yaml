# GPU green-context SM partition: split Thor's 20 SMs between the WBC fast loop and the GR00T slow
# loop. The two partitions must sum to <= 20.
green_context:
  wbc_sms: 2
  gr00t_sms: 18

# Real-time CPU-thread pinning. Opt-in (enable: false by default). The WBC 50 Hz control chain and
# the GR00T heavy op are pinned to dedicated SCHED_FIFO cores so the fast loop's host-side launches
# never wait behind a general-purpose worker. Cores 12 & 13 are the boot-isolated RT cores on this
# host. Priorities are SCHED_FIFO and must be <= the run container's rtprio ceiling (10); honored
# only under the EventBasedScheduler.
operator_pinning:
  enable: false
  wbc_core: 13
  wbc_priority: 10
  gr00t_core: 12
  gr00t_priority: 5

unitree_g1_robot:
  network_interface: "enP2p1s0"
  # 43 = G1 body (29 DOFs) + Dex 3-1 hands (14 DOFs).  The DDS publisher checks
  # this against the postprocessor's output size, so it must match
  # sdk_joint_order below.
  g1_num_motors: 43

# --- Device teleop (gamepad + keyboard, one operator) ---
# TeleopTwistCommandOp reads a gamepad (primary) and a keyboard (fallback).
# Composed only when the app is launched with --gamepad. Look at README for more detail
gamepad:
  lin_speed: 0.5 # m/s at full stick deflection / while a key is held
  ang_speed: 0.5 # rad/s at full stick deflection / while a key is held
  emit_period: 0.004 # s between device polls; well above the 50 Hz control rate so a
  # command is at most one poll old when the policy reads it
  gamepad_device: '' # evdev node or name substring, e.g. /dev/input/event12 or "Xbox" ('' = auto-detect)
  gamepad_deadzone: 0.1 # fraction of full stick deflection ignored around centre
  keyboard_device: '' # evdev node or name substring ('' = auto-detect)

camera:
  device: "/dev/video4"
  frame_rate: 30
  height: 480
  width: 640
  pixel_format: "YUYV"
  pass_through: true
  # Do NOT set `gain`/`exposure_time` here: V4L2VideoCaptureOp issues VIDIOC_S_CTRL for these at
  # startup, and this device's "Camera Controls" class (gain, exposure) rejects writes with
  # EACCES for our (non-root, container) user — crashes the app on start. The "User Controls"
  # class (brightness, gamma, contrast) is writable and does affect the actual pixel data, so
  # under-exposure is compensated externally via `v4l2-ctl -d /dev/video4 -c brightness=... -c
  # gamma=...` before launching the app, not through this config.

format_converter:
  in_dtype: "yuyv"
  out_dtype: "rgb888" # 3 bytes/px - 3*w*h pool block size
  out_tensor_name: ""

# --- Holoviz display ---
holoviz:
  width: 640
  height: 480
  window_title: "V4L2 Camera Viewer"
  tensors:
    - name: ""
      type: color
      opacity: 1.0
      priority: 0

